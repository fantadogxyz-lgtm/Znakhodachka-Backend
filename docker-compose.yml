services:
  db:
    image: postgres:17.5-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORDS}

    volumes:
      - znahodachka-pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=120
      -c shared_buffers=1GB
      -c effective_cache_size=12GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 3s
      retries: 3

    restart: always

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    image: coollabsio/minio:latest
    container_name: minio-zn
    hostname: minio
    volumes:
      - znahodachka-minio:/data
    environment:
      MINIO_ROOT_USER: ${M_R_U}
      MINIO_ROOT_PASSWORD: ${M_R_P}
      MINIO_DEFAULT_BUCKETS: znahodachka
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 4s
      timeout: 2s
      retries: 3
    command: server /data --console-address ":9001"
    restart: always

  znahodachka:
    image: fantadog/lalala:latest
    ports:
      - "8064:8064"
      - "5512:5505"

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORDS}

      MINIO_LOGIN: ${M_R_U}
      MINIO_PASSWD: ${M_R_P}
      MINIO_URL: ${M_R_URI}

    restart: always

volumes:
  znahodachka-minio:
    name: znahodachka-minio
  znahodachka-pgdata:
    name: znahodachka-pgdata
